<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NFT preview card</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>
  
    <article id="main-container">
      <img class="img-nft" src="images/image-equilibrium.jpg" alt="Equilibriumpic">
      <h1 id="heading1">Equilibrium #3429</h1>
      <p id="para-1">Our Equilibrium Collection Promotes Balance and Calm</p>
    <div id="first">
      <div class="eth-group">
        <img class="eth-icon" src="images/icon-ethereum.svg" alt="ethereum">
        <span id="eth-det">0.041 ETH</span>
      </div>
    
      <div class="clock-group">
        <img class="clock-icon" src="images/icon-clock.svg" alt="clock">
        <span id="clock-det">3 days left</span>
      </div>
    </div>
      <hr id="line">
      <div id="last">
        <img class="avatar-icon" src="images/image-avatar.png" alt="profile pic">
        <span id="details">Creation of <strong>Jules Wyvern</strong></span>
      </div>
    </article>

</body>
</html>
